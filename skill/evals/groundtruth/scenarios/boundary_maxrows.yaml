# E2 场景 6/8: 边界值 — 总行数恰等于 max_rows (L 类) — docs/eval-E2-groundtruth.md §5 #6
case_id: boundary_maxrows
category: boundary
snapshot_id: live-2026-10-04/live_ps1_ra180.0_dec30.0_r60.0as
main_metrics: [M4, M1]
query:
  catalog: ps1                   # 换回 ps1: stripe82 的 id 列名两侧口径不一致 (见 CHANGELOG 登记)
  ra: 180.0
  dec: 30.0
  radius_arcsec: 60.0             # 真实抓取: 174 行全在锥内
  columns: [ps1_source_id, ps1_ra, ps1_dec, ps1_rpsf, ps1_ipsf, ps1_class_star]
  sort: ps1_ra                    # 位置列: ps1_source_id 在本快照整列为空, 按它排等于没排
  order: asc
  max_rows: 174                   # 总行数 174 恰等于 max_rows → truncated 必须为 False
  page_size: 174                  # 174 行 / 每页 174 行 = 1 个满页
expect:
  result_state: rows
  # 行数/截断/页数**不在此声明**: gen_gold 只读 result_state 与 error_code, 这里
  # 写下的数字无人断言 —— 换素材后不会变红, 只会静静变旧 (A7-02: 换素材前写的
  # 「2 行 / 2 页」对应的是 syn 合成快照, 换成 live 快照后对不上金标准现算值)。
  # 权威值见 gold/boundary_maxrows.json 的 row_count / truncation / pagination 段,
  # 以及汇总表 focus/must_confirm 列 (数字由金标准渲染)。
notes: >
  金标准: 截断三元组 (truncated, total_count, returned) 以
  gold/boundary_maxrows.json 为准 —— "恰好够"不是截断 (若被测用 >= 判断就会误报
  truncated=true)。total_count 必须取服务端 getcount 语义 (src/client.py 历史 bug
  已修, E2 钉死)。本快照的行数恰等于 max_rows, 且恰为 page_size 的整数倍 ——
  一套快照同时钉「恰好不截断」与「满页续翻」; 复核要点里的行数/上限/截断标志
  一律由金标准渲染, 本文件不复述。
gold_focus: truncated 三元组恰等判定 + total_count 服务端口径
