# E2 场景 5/8: 多对象 proximity 批量匹配 (L 类) — docs/eval-E2-groundtruth.md §5 #5
case_id: batch_proximity
category: batch_proximity
snapshot_id: live-2026-10-04/live_ps1_proximity_n3_5d2580ec
main_metrics: [M1, M2]
query:
  catalog: ps1
  radius_arcsec: 10.0            # 10" 共用半径: 三个中心各自最近邻在 3.145"/0.167"/0.176" 处
  inputs:                        # 三个中心各贴着一颗不同源 (ops/live_fetch.py e2_proximity_v2)
    - {ra: 180.0, dec: 30.0}        # in0 → 服务端 input_line=1
    - {ra: 180.0011, dec: 29.9995}  # in1 → input_line=2 (与 in0 相距 ~4", 各自最近邻不同)
    - {ra: 180.0004, dec: 29.9990}  # in2 → input_line=3
  columns: [ps1_source_id, ps1_ra, ps1_dec, ps1_rpsf]
  max_rows: 50000
  page_size: 1000
expect:
  result_state: rows
  # 行数/截断标志**不在此声明**: gen_gold 只读 result_state 与 error_code, 这里写下的
  # 数字无人断言 —— 换素材后不会变红 (A7-02: 换素材前这里写的行数提示对应的是
  # syn_batch 合成快照的布局, 换成 live 的三输入快照后对不上金标准现算值; 复核要点里
  # 「一对一/一对多/无匹配 三类都覆盖」也随之变旧 —— 该快照并无无匹配输入)。
  # 权威值见 gold/batch_proximity.json 与汇总表 focus/must_confirm 列 (数字由金标准渲染)。
  matched_keys: []                # 由 oracle 从快照的 inputobjs_input_line 重算, 此处不预填
  unmatched_inputs: []            # 同上: 预填合成行键只会误导人工审核
  semantics: nearest_only         # src/crossmatch.py submit_upload_job 默认 True: 每输入只留最近匹配
notes: >
  L 类真实抓取快照 (live-2026-10-04/live_ps1_proximity_n3_5d2580ec, 3 个输入
  坐标, 响应含 inputobjs_input_line/inputobjs_dist_arcsec 列; 换素材前用的是
  A 的 syn_batch 合成快照 —— 那是 4 输入 / 5 行 / line 0 有 2 候选 / line 3 无匹配
  的布局, 已退役, 此处不复述其行数)。金标准按 E2 §5 #5 + nearest_only 默认语义:
  每输入取半径内最近邻 (GT 用独立 haversine 选, 并列取主键小者), 行键
  in<idx>:<source_id>; 无匹配输入不产行但 batch_inputs 记 matched_key=null
  (inputobjs_* 回连由 input_index 承担)。本快照每个输入有 3 个候选但只留最近邻,
  三个输入全部命中; dist 口径: 冻结的 inputobjs_dist_arcsec 与独立 haversine 角距
  一致 (gold.dist_cross_check 为空 = 无差异登记), 换素材前的 Δdec 口径差异已不复存在。
gold_focus: 最近邻语义 + input_index 复合键 + 无匹配不产行 + inputobjs 回连 + dist 口径核对
