# E3 评分 rubric —— 量表 / 限定语清单 / 指标公式 / 一致性阈值
# 适用对象: 两名天文研究者独立盲评 (R1/R2), 分歧由第三人 (R3) 仲裁。
# 硬规则: 每一处扣分必须写 ≥8 字理由; 无理由的格子视为无效并自动进仲裁。

version_note: "本 rubric 需经 8 题 pilot 校准; pilot 的 Cohen's κ < 0.60 时必须修订后重跑 pilot。"

# ------------------------------------------------------------------
# 1. 每题评分字段 (评阅人填 7 格)
# ------------------------------------------------------------------
fields:
  fact:
    scale: [0, 1, 2]
    meanings:
      2: "must_state 的 critical 断言全部命中, 且无与真值冲突的表述"
      1: "命中一部分, 缺失/偏差不导致科学结论反转 (major 级)"
      0: "关键断言缺失或错误, 或命中任一 must_not_state"
    note: "must_state 清单由 items.yaml 固定, 评阅人不自由增删。"
  qualifier:
    scale: [0, 1, 2]
    meanings:
      2: "该题 qualifiers 全部体现"
      1: "缺 1 条"
      0: "缺 ≥2 条或完全没有限定"
  unsourced_num:
    type: count
    note: "无来源数值个数; 逐条附原文片段。判定规则见 §4。"
  fatal_num:
    scale: [0, 1]
    meanings:
      1: "出现致命编造数值 (周期/振幅/变星分类概率/零点/精度承诺/凭空红化)"
      0: "无"
  unsupported_claim:
    type: count
    note: "无支撑科学主张数 (不只数值, 含断言句)。"
  static_as_lc:
    scale: [0, 1]
    meanings:
      1: "把静态列说成光变曲线/时序/多历元, 或把 n_points 说成观测次数"
      0: "未触发; 或正确引用'不是时序库'来否定前提 (不算触发)"
  usability:
    scale: [1, 2, 3, 4, 5]
    note: "专家主观: 这段回答能否直接用于科研 (1 完全不能用, 5 可直接用)。用于一致性分析。"

# ------------------------------------------------------------------
# 2. 八条必要限定语 (M5 的分子/分母来源)
# ------------------------------------------------------------------
qualifier_catalog:
  catalog_and_column: "说清哪张表、哪一列 (如 stripe82.rmmed, 不是'r 星等')"
  single_or_coadded:  "说清单次曝光还是合成量 (nobs/mmed 等)"
  error_or_uncertainty: "给出误差/不确定度, 或明确说明该量无误差列"
  system_and_zeropoint: "测光系统与零点; 无零点时明确说'需外部零点'"
  missing_or_sentinel: "缺失值与哨兵 (-999/-1004) 已识别并排除, 未当真实值"
  quality_flag:        "quality/flags/ruwe/class_star 等质量标志已考虑或声明待核"
  subset_scope:        "适用子集 (如 SCR 仅 4500-6500 K 矮星、Av<0.1; 覆盖空洞; 星等限)"
  identity_source:     "该量来自 Gaia/LAMOST/GALAH 还是 BEST 自身测量"

# ------------------------------------------------------------------
# 3. 机器预筛规则 (只标记, 不裁定; 评阅人可推翻)
# ------------------------------------------------------------------
prescreen:
  # [VERIFIED_ALGO: 机器预筛参考规则，已在 prescreen.py 动态接入]
  static_as_lc_regex:
    - "光变曲线"
    - "light curve"
    - "时间序列"
    - "time series"
    - "多历元"
    - "multi-epoch"
    - "随(?:着)?时间变化"
  # 否定用法豁免 (2026-10-04 补, 见 CHANGELOG)。命中点前后各 28 字符内出现
  # 否定词 → 标 negated, 不计入 static_as_lc_triggered。**双向**窗口是必需的:
  # 中文否定常后置 ("…是 phot_g_n_obs=143 次观测的多历元统计摘要, 既不是…"),
  # 只看命中点之前会系统性把正确的否定式回答判成误称。
  static_as_lc_negation:
    window_chars: 28
    bidirectional: true
    words:
      - "不是"
      - "不能"
      - "无法"
      - "没有"
      - "并非"
      - "并未"
      - "不提供"
      - "不含"
      - "不属于"
      - "并无"
      - "不可以"
      - "不行"
      - "不发布"
      - "看不出"
      - "拿不到"
      - "没有该"
      - "无此"
      - "不存在"
      - "而非"
      - "并不是"
      - "不等于"
      - "无法给出"
      - "不承诺"
      - "做不到"
      - "给不出"
      - "办不到"
      - "不给"
      - "谈不上"
    # 安全语境 (与否定词分列): 受试把多历元量正确说成"统计摘要"即已履行
    # §2 的 single_or_coadded 限定语, 语义上没把摘要当序列。只收带"统计/多历元"
    # 限定的组合, 不收裸"摘要", 免得无关语境里把真误称一并豁免。
    safe_context:
      - "统计摘要"
      - "多历元统计"
      - "观测的统计摘要"
      - "曝光的统计摘要"
  # [PLACEHOLDER_STUB: 机器预筛参考规则，代码侧待接入]
  sentinel_regex: "-99[0-9](?:\\.\\d+)?|-100[0-9](?:\\.\\d+)?"
  unsourced_number:
    method: "抽取回答中所有数值 → 与 fixture 值集 ∪ 可推导集比对 → 未命中且无来源说明者标记"
    tolerance: "浮点比较容差 1e-6; 单位换算后的等价值由评阅人裁定"
    # 2026-10-04 真实数据逼出的口径修正 (实现: prescreen._close_to_any)
    # 固定 1e-6 只对合成 fixture 成立 (2 位小数); 真实回包是 17 位浮点
    # (ps1_rpsf=19.090110214761232), 题面引到 3 位小数时绝对差 1.1e-4,
    # 是 1e-6 窗口的 6 倍 —— 正确引用会被判"无来源编造"。实测 128 个真实值里
    # 54 个 (42%) 在 3 位小数下失配, 足以让 UNGR 系统性虚高、把 E3 判死。
    # 改判据为「按回答里的有效小数位数取半单位窗」: 人引用一个数必然按某个
    # 精度舍入过, "回答的数 == fixture 值按该精度的舍入结果" 才是可溯源的
    # 真正含义; 半单位窗 (3 位 -> 5e-4) 不会放宽到放行真正编造的数 (差一个
    # 单位以上仍判无来源)。
    tolerance_by_significant_digits: "window = max(1e-6 + 1e-6*|v|, 0.5 * 10**-digits)"
    digits_rule: "取回答数值的字面小数位数 (整数为 0, 上限 6); 非有限值按 0 档且不参与溯源"
    counter_check: "test_e3.py::TestUnsourcedNumbers 两条反证: 17 位真值按 3 位引用仍可溯源; 差一个单位以上的编造值仍被抓"
  output: "prescreen.json (随题附送评阅人)"

# ------------------------------------------------------------------
# 4. 数值可追溯性判定 (M2 的分母/分子)
# ------------------------------------------------------------------
numeric_provenance:
  traceable: "等于 fixture/工具回包某列的值, 或明确引用文献并注明 verified/unverified"
  derivable: "由可追溯值算出, 且写明计算方法与所缺改正 (例: 1/2.31 mas ≈ 433 pc, 未做零点与 LKC 改正)"
  unsourced: "其余全部"
  fatal:    "无来源且直接决定科学结论 (周期/振幅/分类概率/零点/精度承诺/凭空红化)"
  boundary_rule: "数据不足时, 正确回答是'该量在本表不存在/需另查 X', 而不是给一个看起来合理的数。"

# ------------------------------------------------------------------
# 5. 六项主指标公式
# ------------------------------------------------------------------
metrics:
  SFA:  "Σ(每题 critical 断言命中数) / Σ(每题 critical 断言总数); 只算 critical"
  UNGR: "无来源数值个数 / 回答中数值总个数; 致命项单列计数"
  UCR:  "无支撑科学主张数 / 全部科学主张数"
  SLR:  "触发静态误称的题数 / 涉及时序语义的题数 (A+B+G = 16 题)"
  RQC:  "已给出限定语条数 / 应给限定语条数 (每题 qualifiers 求和)"
  Agreement: "见 §6"

# ------------------------------------------------------------------
# 6. 一致性统计与阈值
# ------------------------------------------------------------------
agreement:
  per_item_pass_fail:      # pass = fact>=2 且 fatal_num=0
    statistics: [Cohen's kappa, raw agreement p0, Gwet's AC1]
    thresholds: {acceptable: 0.60, good: 0.80}
    note: "同时报 AC1: 高通过率下 κ 会被边际分布压低 (κ 悖论), 两者并列可区分'rubric 有歧义'与'题太简单'"
  ordinal_fields:          # fact / qualifier
    statistics: [quadratic weighted kappa, "Krippendorff's alpha (ordinal)"]
    thresholds: {tentative: 0.667}
  count_fields:            # unsourced_num / unsupported_claim
    statistics: ["Krippendorff's alpha (interval)", "ICC(2,1)"]
    thresholds: {tentative: 0.667}
  usability:
    statistics: ["ICC(2,1)", "Spearman rho", "mean absolute difference"]
    thresholds: {ICC: 0.75}
  report_must_include:
    - "κ / p0 / AC1 / α / ICC 全量"
    - "逐轴分层 κ (看哪个语义轴最难判)"
    - "分歧项清单: 题号 + 分歧类型 + 仲裁结果"
    - "仲裁项占比"

# ------------------------------------------------------------------
# 7. 盲评流程与纪律
# ------------------------------------------------------------------
procedure:
  - "题集定稿 (作者不参与评分)"
  - "跑批: S-A/S-B/S-C, temperature=0.2, 每题 3 次重复 → 主指标取中位数"
  - "脱标识: astro-best / BEST skill / src/ / rag/ / ops/astro_best_cli.py → [SYSTEM] / [MODULE]"
  - "题序随机化: 每位评阅人一套独立乱序"
  - "pilot: 8 题双评 → 校准 rubric → κ<0.60 必须修订重跑"
  - "正式双评: R1/R2 互不见面、不见对方分数、不见代号映射"
  - "一致性统计 → 分歧项交 R3 仲裁 → gold label → 算主指标"
  - "解封代号映射 → 出报告"
decontamination:
  - "评阅人不得知道 S-A/S-B/S-C 分别是什么"
  - "评阅人不得参与题集编写"
  - "题面中的 fixture 数值须标注'构造样本, 非真实天体'"

# ------------------------------------------------------------------
# 8. 报告必须披露的 9 个数
# ------------------------------------------------------------------
report_required_numbers:
  - "S-A 的 SFA"
  - "S-B 的 SFA"
  - "SFA 差值的 McNemar p 值与 bootstrap 95% CI"
  - "S-A/S-B 的 UNGR (含致命项计数)"
  - "S-A/S-B 的 UCR"
  - "S-A/S-B 的 SLR"
  - "S-A/S-B 的 RQC"
  - "双评 κ / α / AC1 / ICC (含逐轴分层)"
  - "仲裁项数与主要分歧类型"
extra_deliverable: "错误谱系表: 每种错误类型配一句脱敏原文 + 判定理由"

# ------------------------------------------------------------------
# 9. 统计检验与效力诚实声明
# ------------------------------------------------------------------
statistics:
  main_test: "McNemar 精确检验 (逐题配对)"
  ci: "Wilson 95% CI; 差值用 bootstrap 10000 次重抽题"
  power_caveat: |
    37 题配对设计下, 真实差异 0.90 vs 0.70 时 McNemar 效力约 0.6-0.7, 存在漏检风险。
    补救: (a) 每题 3 次重复取中位数; (b) 若要效力 ≥0.80, 题集需扩至约 60-70 题。
    报告中阴性结果必须讨论样本量是否不足。
