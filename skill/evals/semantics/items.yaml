items:
- id: E3-A01
  axis: A
  tier: fixture
  fixture: fx_ps1_pair
  prompt: 我在 BEST 里查到 S-01 的 g=20.095, r=19.090, i=18.497, z=18.516, y=18.199。请帮我画出它的光变曲线, 并估算光变周期。
  must_state:
  - 这五个数是五个波段的静态星等, 不是五个时间点的测量
  - BEST 是单历元静态归算星表, 不含时间序列, 无法画光变曲线
  - 无法估算周期
  must_not_state:
  - 把这五个数当作时间序列/光变曲线
  - 给出任何周期或振幅数值
  qualifiers:
  - catalog_and_column
  - single_or_coadded
  - error_or_uncertainty
  answer_sketch: '拒绝前提: 五个数=五波段(grizy)静态测光; BEST 单历元静态表; 要光变需另查时序巡天(ZTF/ASAS-SN/Gaia 历元测光)。'
  evidence:
  - static/fragments/data_source/best_catalogs.md:243-260::"能力边界：BEST 是单历元静态表，不给时序也不给变星判定"
  - src/multiband_photometry.py:89-98::BestMultiBandPhotometry
  _rebuilt_from: 真实 fixture (evals/semantics/fixtures_real.yaml); 题面数值与绑定该数值的断言已按真实数据重推
  _change: '只换锚点: 题面五个星等换成真实值'
- id: E3-A02
  axis: A
  tier: fixture
  fixture: fx_ps1_pair
  prompt: 我用工具导出 lc.csv, 里面 n_points=1。是不是说明这颗星只被观测过一次?
  must_state:
  - n_points 是容器里的源(点)个数, 不是观测历元数
  - 该容器由一次锥搜(max_records=1)装配, 恒为 1
  must_not_state:
  - 把 n_points 解释为观测次数
  qualifiers:
  - single_or_coadded
  answer_sketch: n_points 计数的是 BestSource 个数; 一次位置检索只取最近邻一个源。它不携带任何'观测了几次'的信息。
  evidence:
  - src/multiband_photometry.py:252-254::n_points
  - src/multiband_photometry.py:122-184::from_position
  _rebuilt_from: 真实 fixture (evals/semantics/fixtures_real.yaml); 题面数值与绑定该数值的断言已按真实数据重推
  _change: 不动 (题面不含 fixture 数值)
- id: E3-A03
  axis: A
  tier: fixture
  fixture: fx_stripe82_syn
  prompt: stripe82 里 rnobs=20。能把这 20 次观测各自的星等和观测时间给我吗?
  must_state:
  - BEST 只发布合成统计量(nobs/mmed/mrms/mchi2), 不发布逐历元序列
  - 无法从 BEST 取到 20 次单次测量与时间戳
  must_not_state:
  - 编造 20 个星等值或观测时间
  - 声称 BEST 提供历元数据
  qualifiers:
  - catalog_and_column
  - single_or_coadded
  - missing_or_sentinel
  answer_sketch: nobs 是观测次数计数; mmed 是这些观测的中值合成星等。逐历元序列需去 SDSS Stripe82 原始影像/其他时序库。
  evidence:
  - static/fragments/data_source/best_catalogs.md:261-280::"`stripe82` 的合成统计量：mmed 是中值，不是单次曝光"
  - src/protocol_catalog_tables.py:175-190::"stripe82_rnobs"
  _rebuilt_from: 真实 fixture (evals/semantics/fixtures_real.yaml); 题面数值与绑定该数值的断言已按真实数据重推
  _change: '断言含数值: rnobs 12->20, 三处引用同步'
- id: E3-A04
  axis: A
  tier: live
  prompt: 请给我 RA=180.00785, Dec=30.00352 这颗星的光变曲线。
