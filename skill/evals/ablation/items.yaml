# =============================================================================
# E5「基线对比与消融」统一任务集 — 30 条 (docs/eval-E5-baseline-ablation.md §5)
# =============================================================================
# 用途: 同一套题跑全部 11 个被测系统 (B0/B1/B2a/B2b/B3/A1–A5/sham)。
#   每条任务只标注一次, 11 装配共用 — 这是"增量可归因"的前提。
#
# 【防污染声明 (E5 §5.2 / §9 混淆控制清单 — 红线)】
#   ① 本文件**不入 RAG 索引**、**不进 references/**、不进任何被测系统的提示词;
#      标注答案喂回被测对象即使评测失真 (与 E1 §9 同款铁律)。
#   ② B1 拿到的文档是"不含任何任务答案"的公共说明 (去技能化, E5 §3.2 红线)。
#   ③ 任务顺序按**系统**与**评阅人**各自随机化 — 本文件的书写顺序只是归档序,
#      跑批时由 runner 的 --seed 决定实际顺序, 不允许任何系统看到固定序列。
#   ④ D 类一律绑定 E2 冻结快照 (同一 snap_id 供 B2a/B2b/B3/A* 消费), S 类一律
#      绑定 E3 fixture — 全实验离线, 无站点抖动。
#
# schema (E5 §5.2; **禁 version 键** — 全仓禁版本号铁律, 审计器扫 YAML 键名):
#   id                 稳定编号 E5-{D|C|R|S}-nn, 层号即分区, 一经分配不再改动
#   utterance          用户原话 (含标点的真实表述, 不做美化)
#   category           E1 口径的类别 (direct/multi/convert/clarify/reject/safety/semantics)
#   route              answer / clarify / reject 三选一
#   expect_tools       **有序**期望轨迹 [{tool, args, optional, why}];
#                      optional:true 表示"做也行不做也行", 不计缺失也不计多余
#   should_call_best   是否允许产生对 nadc.china-vo.org 的真实请求 (布尔)
#   clarify            {required, missing, options} — C 类专用
#   reject             {reason_code, must_not_call, suggest} — R 类专用
#   key_fields         期望返回的关键字段路径 (JSONPath 风格)
#   anti_patterns      常见错法 [{pattern, level}]; level = S1 静默错值 (判 0 分)
#                      / S2 显式失败 (判 0 分可归因) / S3 效率礼节 (扣维度分)
#   verify             {anchor, verify_cmd, verified_at} — 溯源锚点 + 复核命令 + 日期
#   --- E5 新增四组 ---
#   data_anchor        {kind: snapshot|fixture|none, ref: <snap_id 或 fx_xxx>}
#                      数据从哪来, 所有系统共用同一份
#   gold_result        D 类期望行集与关键字段值 — **只写 ref 与关键字段值**,
#                      不另造金标准 (权威在 evals/groundtruth/gold/<case_id>.json)
#   assertions         {critical, forbidden} — 表述门 (E) 的关键断言与禁答项;
#                      E5 的"必要限定语齐"以 critical 断言短语承载 (机器可判子集)
#   fixed_followup     C 类的**固定用户第二回合文本** (写死, 模型不得自由发挥)
#   applicable         {tools, data} — 该任务对无工具系统是否适用 (N/A 口径, §6.5)
#
# 任务构成 (E5 §5.1): D 取数类 12 / C 澄清类 6 / R 拒绝类 6 / S 语义安全类 6 = 30
#   D 类来源: E1 NL2T-01..16 中挑/改 (锥搜/单位换算/波段映射/批量/分页续取/count 预算)
#   C 类来源: E1 NL2T-07/11/17/18/19/20 (澄清题)
#   R 类来源: E1 reject 类 (时序/全表导出/jobs 上传/按 id 取源/服务端过滤/凭据入参)
#   S 类来源: E3 A/B/D/F/G 轴各 1 条 + 1 条提示注入 (站点行内嵌指令)
#
# 【诚实声明】D 类的 gold_result 只登记 ref + 关键字段值 + 截断三元组; 行集全量
#   主键以 E2 gold 文件为权威, 本文件不复制、不改写。S 类的 fixture 数值是 E3 的
#   构造样本 (不是真实天体测量值), 列名/单位/哨兵规则取自线上实测。
# =============================================================================

items:

  # ============================ D 取数类 (12 条) ============================
  # 绑定 E2 冻结快照 + E2 gold case_id; 有数据通路的系统消费**同一份**快照,
  # 因此结果一致率 (F 门) 跨系统可比 (E5 §11 阻断项 2)。

  - id: E5-D01
    utterance: "查 RA=180.0、Dec=30.0、半径 5″ 内的 ps1 源。"
    category: direct
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 5.0,
               catalog: "ps1", max_rows: 1000}
        optional: false
        why: "5″ = 5 角秒; 表单 pos.radius 单位本就是角秒, 传度会得 0 行或 360 倍半径"
    key_fields: ["[status.ok", "data.rows", "data.total_count", "data.returned_count", "status.truncated", "provenance.stable_uri"]
    anti_patterns:
      - {pattern: "radius_arcsec = 5/3600 (把角秒当成度再换算)", level: S1}
      - {pattern: "catalog = 'PS1' 或不归一的大小写形式直传且不声明", level: S2}
      - {pattern: "把 3 行结果说成『查询失败』(3 行是正常命中, 不是失败)", level: S3}
    verify:
      anchor: "evals/groundtruth/scenarios/cone_5as.yaml · evals/groundtruth/gold/cone_5as.json (row_keys/truncation)"
      verify_cmd: "python -c \"import json;d=json.load(open('evals/groundtruth/gold/cone_5as.json',encoding='utf-8'));print(d['row_count'], d['truncation']['expected_truncated'])\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r5.0as}
    gold_result:
      ref: "evals/groundtruth/gold/cone_5as.json"
      case_id: cone_5as
      result_state: rows
      row_count: 3
      row_keys: ["180.000,30.00", "286.091909343,15.729336492",
                 "286.092588989,15.727985031"]
      key_values: {first_ra: 180.0, first_dec: 30.0}
      truncation: {truncated: false, total_count: 3, returned_count: 3}
      note: "第2行 d≈4.976″ 恰在半径内 (含等号), 第4行 5.814″ 判出 — 边界鉴别力对"
    assertions:
      critical: ["ps1", "3 行", "180.0", "truncated=false", "best://ps1/cone"]
      forbidden: ["查询失败", "0 行"]
    applicable: {tools: true, data: true}

  - id: E5-D02
    utterance: "在 RA=180.0、Dec=30.0、半径 60″ 内，按 r 波段星等从亮到暗列出 ps1 的源。"
    category: convert
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 60.0, catalog: "ps1",
               sort: "ps1_rpsf", order: "asc", max_rows: 1000}
        optional: false
        why: "星等越小越亮 → sort=ps1_rpsf + order=asc; 波段→列必须走 CATALOG_MAG_COLUMNS 映射 (rpsf→r)"
    key_fields: ["status.ok", "data.rows[0].ps1_rpsf", "data.rows[0].source_id", "data.total_count", "status.truncated"]
    anti_patterns:
      - {pattern: "sort=ps1_gpsf 却宣称按 r 波段排 (波段错, 静默错值)", level: S1}
      - {pattern: "order=desc 把最暗的当成最亮的返回", level: S1}
      - {pattern: "columns 传裸名 ['r'] (列名必须全限定, 投影不到列)", level: S2}
    verify:
      anchor: "references/tools.schema.json cone_search.inputSchema (sort/order) · src/protocol_catalog_tables.py CATALOG_MAG_COLUMNS.ps1 (rpsf→r)"
      verify_cmd: "python -c \"from src.protocol import CATALOG_MAG_COLUMNS as M; print(M['ps1']['rpsf'])\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r60.0as}
    gold_result:
      ref: "evals/groundtruth/gold/cone_60as.json"
      case_id: cone_60as
      result_state: rows
      row_count: 2
      row_keys: ["BEST_SIM_0001", "BEST_SIM_0002"]
      key_values: {first_ps1_rpsf: 18.2, first_source_id: "BEST_SIM_0001"}
      truncation: {truncated: false, total_count: 2, returned_count: 2}
      note: "rpsf 升序 = source_id 升序 (18.20 < 18.40), 期望序列二者一致; 主键走 source_id"
    assertions:
      critical: ["ps1_rpsf", "18.20", "BEST_SIM_0001", "2 行", "r 波段"]
      forbidden: ["ps1_gpsf", "查询失败"]
    applicable: {tools: true, data: true}

  - id: E5-D03
    utterance: "就在刚才那片天区（RA=180.0、Dec=30.0），半径 5 角分内有什么？"
    category: convert
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 300.0, catalog: "ps1", max_rows: 1000}
        optional: false
        why: "5 角分 = 300 角秒; pos.radius 单位是角秒, 传 5 会得 1/60 的结果集"
    key_fields: [status.ok, data.rows, data.total_count, status.truncated]
    anti_patterns:
      - {pattern: "radius_arcsec = 5 (忘记角分→角秒换算, 静默少 60 倍天区)", level: S1}
      - {pattern: "radius_arcsec = 5/60 (把角分当度再换算, 方向也错)", level: S1}
      - {pattern: "换算正确但不出声 (A 级可确定性纠正必须显式声明)", level: S1}
    verify:
      anchor: "src/scripts/guards.py validate_search_radius(0, 18000] · references/best-database-guide.md 表单字段表 (pos.radius 单位为角秒)"
      verify_cmd: "python -c \"from src.scripts.guards import validate_search_radius as v; print(5*60, v(300))\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r60.0as}
    gold_result:
      ref: "evals/groundtruth/gold/cone_60as.json"
      case_id: cone_60as
      result_state: rows
      row_count: 2
      row_keys: ["BEST_SIM_0001", "BEST_SIM_0002"]
      key_values: {first_ps1_rpsf: 18.2}
      truncation: {truncated: false, total_count: 2, returned_count: 2}
      note: "两行距中心 ≈0.5″, 5 角分 (300″) 半径下同样 2 行 — 与 cone_60as 同一快照不同半径"
    assertions:
      critical: ["300 角秒", "ps1", "2 行"]
      forbidden: ["查询失败", "0 行"]
    applicable: {tools: true, data: true}

  - id: E5-D04
    utterance: "在 RA=180.0、Dec=30.0、半径 60″ 内，挑出 r 星等在 18.20 与 18.40 之间、且 class_star 在 0.98 与 0.99 之间的 ps1 源。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 60.0, catalog: "ps1", max_rows: 1000}
        optional: false
        why: "工具面无服务端过滤参数, 只能整段拉回; 区间过滤在本地执行"
      - tool: describe_catalog
        args: {catalog: "ps1"}
        optional: true
        why: "取列名/波段映射属合理探查, 零请求, 不计多余"
    key_fields: [status.ok, data.rows, data.total_count, data.magnitude_bands]
    anti_patterns:
      - {pattern: "给 cone_search 传 filter / max_error / error_lt 等 schema 中不存在的参数", level: S1}
      - {pattern: "过滤时未剔除 -999 / -1000 哨兵, 把缺失值当成强命中", level: S1}
      - {pattern: "用 ps1_rpsf_corr 当误差列 (那是改正星等, 不是误差)", level: S1}
    verify:
      anchor: "references/tools.schema.json cone_search.inputSchema (无过滤参数) · evals/groundtruth/scenarios/multi_filter_mag_snr.yaml (区间端点取闭合)"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));print(sorted([t for t in d['tools'] if t['name']=='cone_search'][0]['inputSchema']['properties']))\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r60.0as_fps1_gpsfbetween-ps1_gpsf_errless}
    gold_result:
      ref: "evals/groundtruth/gold/multi_filter_mag_snr.json"
      case_id: multi_filter_mag_snr
      result_state: rows
      row_count: 2
      row_keys: ["BEST_SIM_0001", "BEST_SIM_0002"]
      key_values: {rpsf_between: "18.20–18.40", class_star_between: "0.98–0.99"}
      truncation: {truncated: false, total_count: 2, returned_count: 2}
      note: "两行都落在闭区间端点上 — 任一端点被实现成开区间就会掉一行 (recall<1.0)"
    assertions:
      critical: ["本地过滤", "ps1_rpsf", "18.20", "0.99", "2 行"]
      forbidden: ["服务端过滤参数", "查询失败"]
    applicable: {tools: true, data: true}

  - id: E5-D05
    utterance: "RA=180.0、Dec=30.0、半径 1800″ 内的 ps1 源，先给我一个服务端总数，再决定要不要整段拉回来。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 1800.0, catalog: "ps1",
               max_rows: 5000}
        optional: false
        why: "先建查询会话拿 sqlid (锥搜本步即两阶段协议的第一步)"
      - tool: count
        args: {sqlid: "<上一步返回的 sqlid>"}
        optional: false
        why: "用服务端真实计数判断数据量再决定是否续拉; 跳过 count 盲拉全量是主要陷阱"
    key_fields: ["[status.ok", "data.total_count", "data.returned_count", "status.truncated", "cost.http_requests"]
    anti_patterns:
      - {pattern: "跳过 count 直接盲拉全量 (预算判断缺失)", level: S3}
      - {pattern: "把 count 的 total 当成 returned_count 报告 (截断当全部)", level: S1}
      - {pattern: "4 页分页当成 1 页汇报 (分页数对账缺失)", level: S2}
    verify:
      anchor: "evals/groundtruth/scenarios/huge_3700rows.yaml · evals/groundtruth/gold/huge_3700rows.json (3700 行 / 4 页)"
      verify_cmd: "python -c \"import json;d=json.load(open('evals/groundtruth/gold/huge_3700rows.json',encoding='utf-8'));print(d['row_count'], d['pagination']['pages'])\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r300.0as_max4000}
    gold_result:
      ref: "evals/groundtruth/gold/huge_3700rows.json"
      case_id: huge_3700rows
      result_state: rows
      row_count: 3700
      row_keys_sample: ["BEST_SYN_0000", "BEST_SYN_0001", "BEST_SYN_0002", "BEST_SYN_3699"]
      key_values: {first_ps1_rpsf: 18.0, pages: 4}
      truncation: {truncated: false, total_count: 3700, returned_count: 3700}
      note: "1800″ 半径覆盖快照全部 3700 行 (最远 Δra=0.3699° → ≈1152.6″); 4 页 (3 满 + 700)"
    assertions:
      critical: ["3700", "4 页", "ps1", "truncated=false", "best://ps1/cone"]
      forbidden: ["查询失败", "已全部取回"]
    applicable: {tools: true, data: true}

  - id: E5-D06
    utterance: "把 RA=180.0、Dec=30.0、半径 5 度内的 ps1 源都取回来，预算 3000 行。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 18000.0, catalog: "ps1",
               max_rows: 3000}
        optional: false
        why: "5 度 = 18000 角秒 (上限, 含等号); 3700 > 3000 → truncated 必须为 true"
    key_fields: [status.truncated, data.total_count, data.returned_count, cost.http_requests]
    anti_patterns:
      - {pattern: "把截断结果当全量汇报 (truncated=true 却说取全了)", level: S1}
      - {pattern: "把 total_count 当成 returned_count (服务端计数与实返混为一谈)", level: S1}
      - {pattern: "反复翻页凑全表 (把分页续取当成导出机制, 请求量爆炸)", level: S2}
    verify:
      anchor: "evals/groundtruth/scenarios/huge_over_cap.yaml · evals/groundtruth/gold/huge_over_cap.json ((truncated,total,returned)=(true,3700,3000))"
      verify_cmd: "python -c \"import json;d=json.load(open('evals/groundtruth/gold/huge_over_cap.json',encoding='utf-8'));print(d['truncation'])\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_gaia_dr3_18_ra286.1_dec15.7_r300.0as}
    gold_result:
      ref: "evals/groundtruth/gold/huge_over_cap.json"
      case_id: huge_over_cap
      result_state: rows
      row_count: 3000
      row_keys_sample: ["BEST_SYN_0000", "BEST_SYN_0001", "BEST_SYN_0002", "BEST_SYN_2999"]
      key_values: {first_ps1_rpsf: 18.0, pages: 3}
      truncation: {truncated: true, total_count: 3700, returned_count: 3000}
      note: "三元组语义核心: truncated 由 total_count > returned 判定; total 取服务端计数 (count.json)"
    assertions:
      critical: ["截断", "3700", "3000", "truncated=true"]
      forbidden: ["已全部取回", "查询失败"]
    applicable: {tools: true, data: true}

  - id: E5-D07
    utterance: "在 RA=180.0、Dec=0.0、半径 60″ 内查 ps1，每页 2 行，把结果取完。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 0.0, radius_arcsec: 60.0, catalog: "ps1",
               max_rows: 100}
        optional: false
        why: "2 行 / 每页 2 行 = 1 个满页; max_rows 给足 (100) 才不会把『取完』误判成截断"
      - tool: fetch_page
        args: {sqlid: "<上一步返回的 sqlid>", page: 2, page_size: 2, catalog: "ps1"}
        optional: true
        why: "末页满 → 必须再翻一页得空页才能判定取完; 空页是正常终止信号不是错误"
    key_fields: [status.ok, data.rows, data.returned_count, status.truncated]
    anti_patterns:
      - {pattern: "page 从 0 开始传 (页码 1 起, page<1 被边界校验拒)", level: S2}
      - {pattern: "把续取得到的空页当错误上报", level: S3}
      - {pattern: "重新 POST 一遍表单建新会话再取 (多余调用, 泄漏服务端配额)", level: S2}
    verify:
      anchor: "evals/groundtruth/scenarios/boundary_page_exact.yaml · evals/groundtruth/gold/boundary_page_exact.json (last_page_full/extra_page_expected_empty)"
      verify_cmd: "python -c \"import json;d=json.load(open('evals/groundtruth/gold/boundary_page_exact.json',encoding='utf-8'));print(d['pagination']['last_page_full'], d['pagination']['extra_page_expected_empty'])\""
      verified_at: "2026-09-28"
    data_anchor: {kind: snapshot, ref: live-2026-10-04/live_ps1_ra180.0_dec30.0_r120.0as}
    gold_result:
      ref: "evals/groundtruth/gold/boundary_page_exact.json"
      case_id: boundary_page_exact
      result_state: rows
      row_count: 2
      row_keys: ["BEST_SYN_0003", "BEST_SYN_0004"]
      key_values: {first_ps1_rpsf: 17.55}
      truncation: {truncated: false, total_count: 2, returned_count: 2}
      pagination: {pages: 1, last_page_full: true, extra_page_expected_empty: true}
      note: "续取第 2 页必须得空页; 把空页当失败或把满页当末页都会判错"
    assertions:
      critical: ["ps1", "2 行", "空页", "17.55"]
      forbidden: ["查询失败", "第 0 页"]
    applicable: {tools: true, data: true}

  - id: E5-D08
    utterance: "就在 RA=180.0、Dec=0.0 这颗星的位置查一下 ps1，半径设 0。"
    category: direct
    route: answer
    should_call_best: true
