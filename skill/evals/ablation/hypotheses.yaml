  - id: POSTHOC-R-CLASS-ELIGIBILITY
    raised_at: "2026-10-10"
    relates_to: [A3]
    finding: >
      **R 类合格性判据**: 一条 R 类题必须满足「**没有任何装配拥有达成其目的的路径**」。
      理由: 题集自述 R 类是「零请求; B0/B1 也能答 → 测文档知识贡献的关键子集」。
      若某装配**有**达成目的的路径, 则该题的正确答案会随装配而变
      (B0 无工具 → reject; B3 有工具 → clarify), 于是它把「知不知道边界」
      与「有没有工具」混在一起 —— 而 R 类只该测前者。

      **判别式 (裁定原则)**: 「缺的那一项, **用户能不能补上**?」
      能 → `clarify`; 不能 → `reject`。它与决策段提示词里既有的界线问句同源。

      逐题适用: R03 改写前 —— 用户手里就有那份星表, 贴坐标即可 → clarify (故不合格);
      R04 —— 用户只有 source_id, 而系统无 ID→坐标解析器, 缺的那项**用户补不上** → reject (合格);
      R05 改写前 —— 缺的不是天区而是服务端过滤能力, 无参数可补 → reject, 但原问句写松了。

      **R03/R05 原问句比意图松**: 两者的 `reason_code` 与 `suggest` 本就指向
      「要 OAuth 的 /jobs 端点」与「站点支持但工具面不暴露的过滤参数」,
      而问句只写了「上传」与「筛一下」。代理按松问句判 clarify **并不冤**。
    scope: >
      20 条 R 题已按该判据全量复核: 改写后全部合格。
      R03/R05 的改写**作废其既有采集**(含 7+ 次独立判断) —— 那些测的是旧问句, 须重采。
    action: >
      R03 问句改为指向 `/jobs` 上传作业; R05 问句改为明确要求服务端过滤并封掉本地近似。
      两者 `reason_code` 不变 (本来就对)。判别式写入方案 §6, 与四条有序规则并列。

  - id: POSTHOC-R-REWRITE-MUST-KILL-THE-GOAL
    raised_at: "2026-10-10"
    relates_to: [A3]
    finding: >
      **改写 R 题时, 必须移除可达的「目的」, 而不是仅仅指向机制。**
      判别式 (「缺的那项用户能不能补」) 是对**目的**应用的: 只要问句里还留着一个
      可达的目的从句, 机制 (上传 / 服务端过滤) 就退居次要, 代理会判 clarify。

      两轮实测 (同一题 E5-R03):
      ① 「用坐标上传建一个 /jobs 作业, **把我这批坐标跑成标准星表**。」
         → A3 = clarify、B3 = clarify。代理理由: `crossmatch_batch` 正是
         「一批坐标跑成标准星表」那条路, `/jobs` 只是站点侧叫法。
      ② 「把这批坐标上传建成站点上的**可复用作业**（/jobs）, 返回 job_id……」
         → A3 = **reject**、B3 = **reject**。交付物本身 (持久作业句柄) 不可达。

      对照: E5-R05 一轮即成立, 因为它**显式封掉了**替代路径
      (「不要先把整段取回来再在本地筛」) —— 封路径与换交付物是同一件事的两种写法。
    scope: >
      本教训对**所有** R 题的改写与新增造题适用, 已写入方案 §4 的造题纪律。
      它也解释了为何原 R03 的问句会被 7+ 次独立判断判 clarify:
      原句「上传我的星表做交叉匹配」的目的 (交叉匹配) 在工具面内可达。
    action: >
      R03 采用二轮改写; 新增/改写 R 题时一律自检:
      「问句里是否还留着一个任一装配可达的目的?」留了就改。

