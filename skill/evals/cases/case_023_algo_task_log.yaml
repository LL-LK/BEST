name: astro-best.case_023_algo_task_log
skill: astro-best
derived_from: "algorithm:{'name': 'TaskLogger', 'module': 'src.task_log'}"
given:
  TaskLogQuery:
    job_id: "<string:id>"
expect:
  status: pass
  log.format: "jsonl"
  log.path: ".logs/task_log.jsonl"
  log.views: [tail, problems, tasks, summary]
  log.events: [submit, start, page, done, blocked, failed, cancelled, hook, query]

