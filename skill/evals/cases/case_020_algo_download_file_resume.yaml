name: astro-best.case_020_algo_download_file_resume
skill: astro-best
derived_from: "algorithm:{'name': 'download_file', 'module': 'src.best_export'}"
given:
  FileDownload:
    url: "<string:url>"
    savedir: "<string:path>"
expect:
  status: pass
  download.byte_resume: "range_header"
  download.partial_suffix: ".part"
  download.range_fallback: "full_restart_on_200"
  download.entry: "best_export.download_file"

