# =============================================================================
# E1 跑批上下文前缀 (context primer) — 只补给"对话续接题"
# =============================================================================
# 存在理由: 26 条里有 5 条的用户原话**自带指代** ("就在刚才那片天区"、
# "这颗星"、"结果被截断了"), 单独丢进一个空会话, 模型无从作答 —— 严格一题一
# 会话会把它们变成无解题, 判出来的分不是能力低, 是题被切断了。
#
# 但反方向更要命: NL2T-18 "帮我查一下那个源" / NL2T-19 "给我一份标准星清单" /
# NL2T-20 "这个字段代表逐历元星等吗" —— 这几条**缺指代本身就是考点**
# (标注 route=clarify, 期望零调用)。给它们补上下文, 等于把"该问清楚"变成
# "可以直接查", 整道题失效, 而且失效方向是**变绿**: MissedClarifyRate 会假 0。
#
# 所以本文件的口径是: **按标注意图给最小上下文, 而不是一律给或一律不给。**
#
# 铁律: primer 只能写"用户说过的话"或"工具返回的事实",
#       **绝不写上一轮助手是怎么答的** —— 那是在示范正确调用, 等于给答案。
#
# 状态: 草案, 待人工确认 (primer 属于题目输入的一部分, 不是标注答案,
#       但改动它等价于改动题目, 确认后在 CHANGELOG.md 记一笔)。
# =============================================================================

# =============================================================================
# bindings 段 —— 占位符具化表 (判分时把标注的 <...> 换成上文声明的值)
# =============================================================================
# 为什么需要它: 标注里 ``ra: "<上下文天区的 ra>"`` 这类占位符, 判定时按通配处理
# (值来自上一步返回或用户补充, 本来无从比对)。但**单轮盲测下没有上文可依**,
# 通配就变成了"模型杜撰什么坐标都不扣分" —— 实测 NL2T-09/10/12 杜撰作答拿 0.800
# 且零红线, 而规规矩矩澄清只拿 0.1 还背 S1 红线。判分器在系统性地奖杜撰、罚诚实。
#
# 补了上文之后, 天区是确定的, 占位符就有了确定值。这里把它写死, 判定时替换进去,
# 杜撰坐标立刻现形 (与硬编码期望值同口径比对)。
#
# 铁律: bindings 的值必须与 turns 里声明的上文**一致**, 否则等于给模型设了一个
# 它永远猜不对的答案。改 turns 就要改 bindings。
# =============================================================================

primers:

  # ---------------------------------------------------------------- 06 续接: 天区指代
  NL2T-06:
    intent: "『先看看这个天区有多少源』缺天区; 补一个中性天区, 不暗示该先 count 还是先拉"
    turns:
      - role: user
        text: "RA=180.0、Dec=30.0、半径 60″ 内有什么？"
    # 标注此处 ra/dec 已是硬编码 180/30 (非占位符), binding 只作一致性声明,
    # 值必须与本 turns 与标注两边都对得上。
    bindings: {ra: 180.0, dec: 30.0}

  # ---------------------------------------------------------------- 08 续接: 截断续页
  NL2T-08:
    intent: "『结果被截断了』需要上一轮的会话 id; 补工具返回的事实 (truncated/sqlid), 不补助手回答"
    turns:
      - role: user
        text: "查 RA=180.0、Dec=30.0、半径 60″ 内的 ps1 源。"
      - role: tool_result
        text: "status.truncated = true, sqlid = s3898, returned_count = 1000, total_count = 5000"
    # 续页要拿的就是这个会话 id; 模型若另编一个 sqlid 即判错 (此前占位符通配,
    # 编什么都过)。
    bindings: {sqlid: "s3898"}

  # ---------------------------------------------------------------- 09 续接: 天体名指代
  NL2T-09:
    intent: "『这颗星』缺名字; 补一个中性天体名, 不暗示要先解算坐标"
    turns:
      - role: user
        text: "我关注的是 M31（仙女座星系）。"
    # 只具化 name: ra/dec 是 resolve_name 的返回值, 无法预先写死, 维持通配
    # (否则等于要求模型猜中解算结果)。
    bindings: {name: "M31"}

  # ---------------------------------------------------------------- 10 续接: 天区 + 单位换算
  NL2T-10:
    intent: "『刚才那片天区』缺天区; 补天区即可 —— 半径换算 (5 角分→300 角秒) 是本题考点, 不得提示"
    turns:
      - role: user
        text: "查 RA=10.68、Dec=41.27、半径 60″ 内的 ps1 星。"
    # 具化后天区确定: 模型若编一个别的坐标去查, ra/dec 直接判错 (此前通配免检)。
    bindings: {ra: 10.68, dec: 41.27}

  # ---------------------------------------------------------------- 12 续接: 扩大半径
  NL2T-12:
    intent: "『把范围扩大到半径 0.5 度』缺天区; 度→角秒换算是本题考点, 不得提示"
    turns:
      - role: user
        text: "查 RA=180.0、Dec=30.0、半径 60″ 内的 ps1 星。"
    bindings: {ra: 180.0, dec: 30.0}

# ── 反向清单: 这些题**禁止**补上下文 ────────────────────────────────────────
# 缺指代就是考点。生成器遇到本清单里的题却配了 primer, 必须显式失败 ——
# 手滑补一句"那个源是 M31", 会让 NL2T-18 从"应澄清"变成"可作答"。
no_context:
  - NL2T-18    # "帮我查一下那个源" — 无任何定位信息, 期望澄清 (零调用)
  - NL2T-19    # "给我一份标准星清单" — 缺天区与表, 全库导出不支持, 期望澄清
  - NL2T-20    # "这个字段代表逐历元星等吗" — 指代不明, 期望澄清
  - NL2T-22    # "获取这颗星过去五年的光变曲线" — 期望拒绝 + 给替代源, 补坐标无意义
