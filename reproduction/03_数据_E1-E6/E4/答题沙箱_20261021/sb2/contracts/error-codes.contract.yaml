    code: E_INVALID_INPUT
    trigger: 输入未能通过 input.contract.yaml 校验 (坐标越界/约束缺 min-max/列名不在白名单)
    behavior: block (Fail-Closed), 不进入 EXECUTE
  BEST_1006:
    code: E_SOFT_404
