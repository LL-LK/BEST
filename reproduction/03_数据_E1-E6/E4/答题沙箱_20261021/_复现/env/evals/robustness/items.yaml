items:
- id: RB-01
  tier: P
  fault_family: F1
  utterance: 查 RA = -5, Dec = 0 附近 60 角秒内的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: 0 ≤ ra < 360 (src/scripts/guards.py validate_coordinate)
    suggest:
    - ra=-5 越界; 若指 355° (wrap 候选) 请确认后重试
  must_not_call:
  - cone_search
  - crossmatch_batch
  - fetch_page
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/scripts/guards.py validate_coordinate (RA must be in [0, 360)) · references/tools.schema.json
      cone_search.ra
    verify_cmd: python -m src cone --ra -5 --dec 0 --radius 60 --catalog ps1 --max
      1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-02
  tier: P
  fault_family: F1
  utterance: 查 RA = 0, Dec = 95 附近 60 角秒内的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: -90 ≤ dec ≤ 90 (Dec 越过天极不存在任何合法映射)
    suggest:
    - Dec=95 越过北天极; 请修正到 [-90, 90] 区间
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/scripts/guards.py validate_coordinate (Dec must be in [-90, 90]) ·
      与 RA wrap 不同, Dec 无合法映射
    verify_cmd: python -m src cone --ra 0 --dec 95 --radius 60 --catalog ps1 --max
      1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-03
  tier: P
  fault_family: F1
  utterance: 查 RA = "abc", Dec = 30 附近的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: ra 必须是数值 (度) 或可解析的六十进制
    suggest:
    - 请给出数值坐标 (如 180.0) 或标准六十进制 (如 12h30m00s)
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: 'references/tools.schema.json cone_search.ra (type: number) · src/scripts/guards.py
      validate_coordinate'
    verify_cmd: python -m src cone --ra abc --dec 30 --radius 60 --catalog ps1 --max
      1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-04
  tier: P
  fault_family: F1
  utterance: 查 RA = 370, Dec = 30 附近的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: 0 ≤ ra < 360
    suggest:
    - ra=370 越界; 若指 10° (wrap 候选) 请确认后重试
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/scripts/guards.py validate_coordinate (代码层硬抛 ValueError 不做 wrap, agent
      层必须附 wrap 候选)
    verify_cmd: python -m src cone --ra 370 --dec 30 --radius 60 --catalog ps1 --max
      1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-05
  tier: P
  fault_family: F2
  utterance: 帮我查 RA 120.3 Dec -20.4 半径 5 的 ps1 源。
  disposal: C
  clarify:
    required: true
    missing:
    - radius_unit
    # probes: 中文话术里"确实点明了缺什么"的判据 (2026-10-04 补, 见 CHANGELOG)。
    # missing 存的是机器枚举 id, 中文回答永远无法逐字命中 → 该子判据在补 probes
    # 之前对全部 C 级用例恒为 False, M2 被结构性封在 0.5。probes 命中任一即算
    # 点名到位; 词要挑"只有真的点出这一维才会出现"的说法, 不收泛词。
    probes:
    - 单位
    - 角秒
    - 角分
    - 读法
    options:
    - 5 角秒 (5″)
    - 5 角分 (5′ = 300 角秒)
    - 5 度 (= 18000 角秒, 正好在上限)
  must_not_call:
  - cone_search
  judge: blind
  redline: 静默纠正
  note: '本方案鉴别力最强的一条: 无单位 = 三种合法解释差 3600 倍, 默认按角秒查询且不声明 = S1'
  verify:
    anchor: src/scripts/guards.py validate_search_radius ((0, 18000] 角秒) · references/tools.schema.json
      cone_search.radius_arcsec
    verify_cmd: python -c "from src.scripts.guards import validate_search_radius as
      v; print([v(x) for x in (5, 300, 18000)])"
    verified_at: '2026-09-28'
  expect_route: clarify
  should_call_best: false
- id: RB-06
  tier: P
  fault_family: F2
  utterance: 帮我查 RA 120.3 Dec -20.4 半径 5 角分内的 ps1 源。
  disposal: A
  correction:
    from: 5 角分
    to: 300
    must_declare: true
  expect:
    must_correct: true
  judge: program
  redline: 静默纠正
  verify:
    anchor: src/scripts/guards.py validate_search_radius (300 在 (0,18000] 内) · 角分→角秒唯一映射
      5×60=300
    verify_cmd: python -c "from src.scripts.guards import validate_search_radius as
      v; assert v(300)==300.0; print('ok')"
    verified_at: '2026-09-28'
  expect_route: autocorrect
  should_call_best: true
- id: RB-07
  tier: P
  fault_family: F2
  utterance: 查 RA 120.3 Dec -20.4 半径 0 的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: radius_arcsec ∈ (0, 18000]
    suggest:
    - 半径必须为正; 半径 0 不等于'不限', 请给一个正的角秒值
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/scripts/guards.py validate_search_radius (must be positive)
    verify_cmd: python -m src cone --ra 120.3 --dec -20.4 --radius 0 --catalog ps1
      --max 1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-08
  tier: P
  fault_family: F2
  utterance: 查 RA 120.3 Dec -20.4 半径 6 度的 ps1 源。
  disposal: B
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: radius_arcsec ≤ 18000 (= 5 度)
    suggest:
    - 6 度 = 21600 角秒超上限; 建议切分成若干个 ≤5 度的锥再合并
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/scripts/guards.py validate_search_radius (too large) · references/tools.schema.json
      maximum 18000
    verify_cmd: python -m src cone --ra 120.3 --dec -20.4 --radius 21600 --catalog
      ps1 --max 1 2>&1 | Select-Object -Last 1
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-09
  tier: P
  fault_family: F3
  utterance: 查这颗星在 ps1 的 J 波段星等。
  # T9 (2026-10-21): 原话同时缺"目标天体", 旧标注只按波段单因判 B —— 模型把两个缺陷
  # 都点名、走 C 澄清, 却被记 disposal_mismatch。改为容许集 + must_name(两缺陷都要点名),
  # 允许 C 但不允许含糊。
  disposal:
  - B
  - C
  disposal_prev: B
  change_reason: 'T9 多缺陷题: 缺目标天体 + 无 J 波段, 单标签判 B 会误伤正确澄清'
  must_name:
  - id: no_j_band
    any_of: [没有 J, 无 J, 不提供 J, 不含 J, 没有「J」, 没有 J 波段, 无近红外, 近红外需求]
  - id: missing_target
    any_of: [哪颗星, 没指明, 未指明, 缺目标, 目标天体, 没有指定目标, 请给星名, 请给坐标, 没有说清]
  clarify:
    required: true
    missing: [no_j_band, missing_target]
    options:
    - 说明 ps1 无 J 波段, 改用 2MASS/VISTA 等近红外星表
    - 若坚持 ps1, 请从 g/r/i/z/y 中选一个波段并给目标天体
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: BEST 无近红外波段; ps1 只有 g/r/i/z/y
    suggest:
    - 近红外需求请改用 2MASS/VISTA 等星表 (astro-catalog 承接)
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/protocol_catalog_tables.py CATALOG_MAG_COLUMNS.ps1 (g/r/i/z/y) · references/photometric-systems.md
    verify_cmd: python -c "from src.protocol import CATALOG_MAG_COLUMNS as c; print(sorted(c['ps1'].keys()))"
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-10
  tier: P
  fault_family: F3
  utterance: 查 ps1 的 u 波段星等。
  disposal:
  - B
  - C
  disposal_prev: B
  change_reason: 'T9 多缺陷题: 缺目标天体 + ps1 无 u 波段'
  must_name:
  - id: no_u_band
    any_of: [不发布 u, 没有 u, 无 u, 不提供 u, 不含 u, 没有 u 波段]
  - id: missing_target
    any_of: [哪颗星, 没指明, 未指明, 缺目标, 目标天体, 没有指定目标, 请给星名, 请给坐标, 无法定位]
  clarify:
    required: true
    missing: [no_u_band, missing_target]
    options:
    - 说明 ps1 无 u 波段, 改用 sdss/uss_dr1/splus_dr4 等发布 u 波段的表
    - 若坚持 ps1, 请从 g/r/i/z/y 中选一个波段并给目标天体
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: ps1 不发布 u 波段 (g/r/i/z/y); BEST 19 个测光系统里 ps1 无 u
    suggest:
    - u 波段请查 sdss (sdss.u)
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: src/protocol_catalog_tables.py CATALOG_MAG_COLUMNS.ps1 (实测无 u) · references/photometric-systems.md
    verify_cmd: python -c "from src.protocol import CATALOG_MAG_COLUMNS as c; print('u'
      in c['ps1'])"
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-11
  tier: P
  fault_family: F3
  utterance: 查 Hα 窄带测光。
  disposal:
  - B
  - C
  disposal_prev: B
  change_reason: 'T9 多缺陷题: 缺目标天体 + BEST 无窄带/Hα 滤光片'
  must_name:
  - id: no_ha_filter
    any_of: [没有名为, 没有 Hα, 无 Hα, 不含 Hα, 不是滤光片, 没有窄带, 无窄带, 没有「Hα」]
  - id: missing_target
    any_of: [还没给, 没有给, 缺目标, 目标天体, 没有指定目标, 请给坐标, 请给天体名, 检索目标]
  clarify:
    required: true
    missing: [no_ha_filter, missing_target]
    options:
    - 说明 BEST 无 Hα 滤光片, 最接近的是 J0660 窄带 (jplus_dr3/splus_dr4 等表)
    - 若需真正的 Hα 发射线成像, 换用专业窄带巡天; 并请给目标天区
  reject:
    reason_code: E_INVALID_INPUT
    legal_range: BEST 无窄带测光系统
    suggest:
    - 窄带测光请改用专业窄带巡天星表; 不得拿 r 宽带近似
  must_not_call:
  - cone_search
  judge: program
  redline: 硬发请求
  verify:
    anchor: references/photometric-systems.md (BEST 测光系统全集, 无窄带) · src/protocol_catalog_tables.py
    verify_cmd: python -c "from src.protocol import CATALOG_MAG_COLUMNS as c; print(sum(len(v)
      for v in c.values()))"
    verified_at: '2026-09-28'
  expect_route: reject
  should_call_best: false
- id: RB-12
  tier: P
  fault_family: F3
  utterance: 查 ZTF 的 g 星等。
  disposal:
  - B
  - C
  disposal_prev: C
  change_reason: 'R1 (2026-10-21 尺子修正 F2): ps1 无 ZTF 表是能力边界硬事实, 先说明没有 ∈ B 与 先问要哪张表 ∈ C 两种都讲得通 → 容许 B'
  clarify:
    required: true
    missing:
    - ztf_semantics
    # probes: 中文话术里"确实点明了缺什么"的判据 (2026-10-04 补, 见 CHANGELOG)。
    # 不收裸 "ZTF" 三字母: 题面里就有, 命中它等于没判。不收它是为了逼回答真的
    # 说出"ZTF 不是一张表"或"实测交叉列 vs 合成测光"这层语义差别。
    probes:
    # T3 (2026-10-21): 字面串改"概念组" —— any_of 内任一命中即算该概念已点名,
    # 但**概念本身是必需的**。原写法是 5 个裸串做 OR, 模型写"没有独立的「ZTF 星表」"
    # 因中间多了三个字就漏判 (RB-12 实测 named=False)。
    - id: ztf_semantics
      required: true
      any_of:
      - 不是表
      - 不是一张表
      - 没有 ZTF
      - 无 ZTF
      - 没有独立的「ZTF 星表」
      - 没有独立的 ZTF 星表
      - 交叉列
      - 交叉匹配测光列
      - 合成测光
      - 实测
    options:
    - scr_galah/scr_lamost 的 ZTF 实测交叉列 (gztf/rztf/iztf)
    - xpsp 的 Gaia XP 光谱拟合合成测光 (ztf_g_g_xpsp 等) — 科学语义与实测不同
  must_not_call:
  - cone_search
  judge: blind
  redline: 静默纠正
  note: 实测交叉 vs XP 合成是科学语义二义, 擅自选一个即 S1; BEST 无 ZTF 表
  verify:
    anchor: src/protocol_catalog_tables.py CATALOG_COLUMNS.scr_galah(gztf) / xpsp(ztf_g_g_xpsp)
      · 全表清单无 ztf
    verify_cmd: python -c "from src.protocol import CATALOG_PATHS as p; print('ztf'
      in p, 'scr_galah' in p)"
    verified_at: '2026-09-28'
  expect_route: clarify
  should_call_best: false
- id: RB-13
  tier: P
  fault_family: F4
  utterance: 查 source_id 为 BEST_NO_SUCH_ID 的源。
  # T8 (2026-10-21, 计划书 A5): 7 个工具没有任何 source_id 入参, "按 id 查完再报 0 行"
  # 在工具面上不可执行 —— 原 disposal: answer 是一条不可能的指令。按 D 级重定义:
  # 识别"该能力不存在" + 报告事实 + 给坐标路径。旧值留痕在 disposal_prev。
  disposal:
  - D
  - B
  disposal_prev: answer
  change_reason: 'T8/A5: by-id 能力不在工具面内, 原期望不可执行'
  # 容许 B: "能力不存在"场景下拒绝(reject)与即停(stop_report)只差采集标签,
  # 内容要件 (不查 / 报事实 / 给替代) 才是判据 —— 但必须点名 no_id_endpoint。
  must_name:
  - id: no_id_endpoint
    any_of: [按 id 直查, 按 source_id 查询, 没有按 source_id, 没有「按 source_id, 无按 id, 没有按 id, 无 id 端点, 不接受 source_id, 不提供按 id]
  - id: alternative_path
    any_of: [坐标, cone_search, resolve_name, 天体名, 按位置, 先解算]
  stop:
    must_not_output: [编造的星等, 编造的坐标, 虚构的记录]
    report:
    - 本库无按 source_id 取源的端点 (7 个工具均不收 source_id)
    - 可用路径: 给坐标走 cone_search; 或给天体名先 resolve_name 再锥搜
  expect:
    must_correct: false
  must_not_call: []
  judge: program
  redline: 失败包装
  note: '能力不存在 → D: 报告事实 + 给替代路径; 不得伪造一条记录'
  verify:
    anchor: references/tools.schema.json (7 个工具入参均无 source_id) · src/ai_tools.py 工具面
    verify_cmd: python -c "import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));ps=[t['inputSchema']['properties'] for t in d['tools']];print('by-id param count =',sum(1 for p in ps for k in p if 'source_id' in k))"
    verified_at: '2026-10-21'
  expect_route: stop_report
  should_call_best: false
- id: RB-14
  tier: P
  fault_family: F4
  utterance: 查 Gaia DR3 1234567890123456789 在 BEST 标准星表中的记录。
  disposal: C
  clarify:
    required: true
    missing:
    - id_semantics
    - coordinate_path
    # probes: 中文话术里"确实点明了缺什么"的判据 (2026-10-04 补, 见 CHANGELOG)。
    # 本条要两件事同时说清: 按 source_id 取源这条路不存在, 以及出路是先解算坐标。
    # T3 (2026-10-21): 拆成两个必需概念 —— 原 OR 列表下只要提到 resolve_name 就算过,
    # 等于不要求说清"没有按 id 查的端点"这件事。
    probes:
    - id: no_id_endpoint
      required: true
      any_of:
      - 没有按 source_id
      - 没有按 Gaia source_id
      - 没有按 ID 检索
      - 无按 source_id
      - 按 id 取源
      - 没有任何一个接受 source_id
      - 没有按 id 查
    - id: coordinate_path
      required: true
      any_of:
      - Sesame
      - resolve_name
      - 先解算坐标
      - 按位置
      - cone_search
      - crossmatch_batch
    options:
    - BEST 无按 source_id 取源的公开端点; 需先经 CDS Sesame 解算坐标 (resolve_name) 再按坐标检索
    - 确认接受该两阶段路径后继续
  must_not_call:
  - cone_search
  judge: blind
  redline: 硬发请求
  verify:
    anchor: src/lightcurve.py docstring (BEST 无按 ID 检索端点) · src/ai_tools.py resolve_name
      (Sesame 代理)
    verify_cmd: python -c "from src.protocol import NAME_RESOLVE_FAIL_SENTINEL as
      s; print(s)"
    verified_at: '2026-09-28'
  expect_route: clarify
  should_call_best: false
- id: RB-15
  tier: P
  fault_family: F4
  utterance: 查 source_id 为 12345 的源 (传成整数)。
  # T8 (2026-10-21, A5): 原标 A「把整数纠成字符串再查」依赖一个不存在的入参
  # (schema 里 0 处 source_id; 旧 verify_cmd 是 print('ok') 恒真命令)。
  # 能力不存在 → D。
  disposal:
  - D
  - B
  disposal_prev: A
  change_reason: 'T8/A5: 无 source_id 入参, "纠正后继续查"不可执行; 旧 verify_cmd 恒真'
  must_name:
  - id: no_id_endpoint
    any_of: [按 source_id 查询, 没有按 source_id, 没有「按 source_id, 无按 id, 没有按 id, 没有地方可传, 不接受 source_id, 不提供按 id]
  - id: alternative_path
    any_of: [坐标, cone_search, resolve_name, 天体名, 按位置, 锥形检索]
  correction_prev:
    from: 12345 (整数)
    to: '"12345" (字符串)'
    must_declare: true
  stop:
    must_not_output: [编造的星等, 编造的坐标, 虚构的记录]
    report:
    - 本库无按 source_id 取源的端点, 传整数还是字符串都没有地方可传
    - 可用路径: 给坐标走 cone_search; 或给天体名先 resolve_name 再锥搜
  expect:
    must_correct: false
  judge: program
  redline: 失败包装
  verify:
    anchor: references/tools.schema.json (7 个工具入参均无 source_id) · src/download_precise.py (该能力存在但未暴露为工具)
    verify_cmd: python -c "import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));ps=[t['inputSchema']['properties'] for t in d['tools']];print('by-id param count =',sum(1 for p in ps for k in p if 'source_id' in k))"
    verified_at: '2026-10-21'
  expect_route: stop_report
  should_call_best: false
- id: RB-16
  tier: P
  fault_family: F4
  utterance: 查 source_id 为 gaia_xxx 的源。
