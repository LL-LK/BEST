# =============================================================================
# E1「自然语言 → 工具调用」评测 · 28 条任务与专家标注
# =============================================================================
# 用途: 评测「大语言模型 + astro-best 7 个原子工具面」的整体决策能力 —
#   听到一句人话后, 决定叫哪个工具、传什么参数、该不该澄清、该不该拒。
#   本文件只评"决策", 不评"取回来的数据对不对" (后者是 evals/cases 行为用例的职责)。
#
# 防污染铁律 (E1 §9): 本文件**不入 RAG 索引** — 标注答案不得喂回被测对象,
#   否则评测失真。tasks.yaml 冻结后任何改动必须记 CHANGELOG.md。
#
# schema 说明 (文字描述, 不设 version 键 — 全仓禁版本号铁律, 审计器扫 YAML 键名):
#   一条任务 = 一个 YAML 对象, 字段定义见 docs/eval-E1-nl2tool.md §3:
#     id                稳定编号 NL2T-nn, 一经分配不再改动
#     utterance         用户原话 (含标点的真实表述, 不做美化)
#     category          direct(单工具直达) / multi(多步轨迹) / convert(单位·波段转换)
#                      / clarify(应澄清) / reject(应拒绝) / safety(不可信内容·凭据)
#     route             answer(直接答) / clarify / reject 三选一
#     expect_tools      **有序**期望轨迹; 每项 {tool, args, optional, why};
#                      optional:true 表示"做也行不做也行", 不计缺失也不计多余
#     expect_tools_after_clarify  澄清之后才发生的期望轨迹 (澄清阶段期望零调用)
#     should_call_best  是否允许产生对 nadc.china-vo.org 的真实请求 (布尔)
#     clarify           {required, missing, options, partial_credit?, note?}
#     reject            {reason_code, must_not_call, suggest}
#     key_fields        期望返回的关键字段路径 (JSONPath 风格)
#     anti_patterns     常见错法清单, 每项 {pattern, level}; level = S1 静默错值
#                      (判 0 分) / S2 显式失败 (判 0 分可归因) / S3 效率礼节 (扣维度分)
#     verify            {anchor, verify_cmd, verified_at} — 溯源锚点 + 复核命令 + 复核日期
#
# 合法工具面 (唯一): references/tools.schema.json 的 7 个原子工具 —
#   resolve_name / list_catalogs / describe_catalog / cone_search /
#   crossmatch_batch / count / fetch_page。选了这 7 个之外的名字 (CLI、Python 类、
#   伪造工具名) 即判错。
#
# 冻结信息: 2026-09-28 专家标注 + 实机核验 (verified_at 逐条标注)。
#   **例外 (2026-10-17)**: NL2T-27 / NL2T-28 为题卷里早有、标注却缺失的两条,
#   本轮补入 (verified_at: 2026-10-17, 各带 verify_cmd 实跑证据), 详见 CHANGELOG
#   顶节与 REVIEW.md。其余 26 条维持 09-28 冻结不动。
#
# 修订 2026-10-18 (sb1 跑批暴露的题面缺陷, 逐条记 CHANGELOG):
#   1. **gold 只写决策参数**。max_rows / page_size 属执行参数 (页大小), 不参与
#      "该叫什么工具、该传什么值"的判定 —— 保留会让"传 500 而不是 1000"这种
#      与决策无关的差异把 param 维打成 0。已从 06/08/12/21 的 gold 移除。
#   2. **指代必须在题面里闭合**: 05 的"1000 个坐标"补 payload, 09 的"这颗星"改
#      具名恒星, 22 的"这颗星"、27 的"这个天区"补指代。18/13/17/20 的"那个源 /
#      半径 6 度 / 红色波段 / 这个字段"**故意**不补 —— 那四题就是考澄清。
#   3. 21 的 gold 自相矛盾 (nearest_only:true 与 sort/order 同时要求), 已改 false。
# =============================================================================

tasks:

  # -------------------------------------------------- 01 元数据问询 (零请求)
  - id: NL2T-01
    utterance: "BEST 能查哪些星表？"
    category: direct
    route: answer
    should_call_best: false        # 元数据问询必须零请求完成
    expect_tools:
      - tool: list_catalogs
        args: {}
        optional: false
        why: "列可查表是元数据能力, 由零请求工具完成; 为它发真实查询即多余调用"
    key_fields:
      - data.catalogs               # 12 张可查表 (裸 id)
      - data.groups                 # std/calib/other 是导航分组不是表
      - cost.http_requests          # 必须为 0
    anti_patterns:
      - {pattern: "误答成 19 个测光系统 (那是另一维度: 测光系统数 ≠ 可查星表数)", level: S2}
      - {pattern: "把分组 std/calib/other 当成可查表列进去 (分组不是表, /std/q 返回软 404)", level: S2}
      - {pattern: "为回答元数据问题发 cone_search 抽样本 (MetadataQueryByWire)", level: S3}
    verify:
      anchor: "references/tools.schema.json describe_catalog.enum (12 张表) · references/best-database-guide.md 12 张可查表清单"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));print(len(d['tools'][2]['inputSchema']['properties']['catalog']['enum']))\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 02 元数据问询 (零请求)
  - id: NL2T-02
    utterance: "ps1 表有哪些列和波段？"
    category: direct
    route: answer
    should_call_best: false
    expect_tools:
      - tool: describe_catalog
        args: {catalog: "ps1"}
        optional: false
        why: "列清单/波段映射/量纲说明由零请求工具给出, 不需要为这个问题发真实查询"
    key_fields:
      - data.columns
      - data.magnitude_bands         # 波段→列映射 (gpsf→g/rpsf→r/...)
      - data.units_note
      - cost.http_requests           # 必须为 0
    anti_patterns:
      - {pattern: "为元数据问题发 cone_search 抽样本数据再总结列名", level: S3}
      - {pattern: "把 19 个测光系统数当成 ps1 的列数/波段数回答", level: S2}
      - {pattern: "把其他星表的列名安到 ps1 上 (如 splus 的 r_pstotal)", level: S1}
    verify:
      anchor: "src/protocol_catalog_tables.py CATALOG_COLUMNS.ps1 · CATALOG_MAG_COLUMNS.ps1(gpsf/rpsf/ipsf/zpsf/ypsf) · references/tools.schema.json describe_catalog"
      verify_cmd: "python -c \"from src.protocol import CATALOG_COLUMNS as C, CATALOG_MAG_COLUMNS as M; print(len(C['ps1']), M['ps1'])\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 03 名称解析
  - id: NL2T-03
    utterance: "M31 的坐标是多少？"
    category: direct
    route: answer
    should_call_best: true          # resolve_name 走 CDS Sesame 代理, 是真实外部请求
    expect_tools:
      - tool: resolve_name
        args: {name: "M31"}
        optional: false
        why: "天体名→坐标唯一入口; 失败是 HTTP 200 + ra=dec=-1000 哨兵, 不是报错"
    key_fields:
      - status.ok
      - data.ra
      - data.dec
      - data.name_resolved
    anti_patterns:
      - {pattern: "拿到 -1000 哨兵还当坐标用 (NAME_RESOLVE_FAIL_SENTINEL, 不得当坐标)", level: S1}
      - {pattern: "把解析失败说成『M31 不存在』(失败 ≠ 天体不存在, 可能是服务/标识符问题)", level: S3}
      - {pattern: "不调 resolve_name, 直接用 cone_search 反查坐标", level: S3}
    verify:
      anchor: "src/protocol.py NAME_RESOLVE_FAIL_SENTINEL = -1000.0 · references/site-endpoints-and-interactions.md 名称解析段"
      verify_cmd: "python -c \"from src.protocol import NAME_RESOLVE_FAIL_SENTINEL as S; print(S)\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 04 锥搜直达
  - id: NL2T-04
    utterance: "查 RA=10.68、Dec=41.27、半径 60″ 内的 ps1 星。"
    category: direct
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 10.68, dec: 41.27, radius_arcsec: 60.0, catalog: "ps1",
               max_rows: 1000, nearest_only: false}
        optional: false
        why: "60″ = 60 角秒; 表单 pos.radius 单位本就是角秒, 传度会得 0 行或 360 倍半径"
    key_fields:
      - status.ok
      - data.rows
      - data.total_count
      - data.returned_count
      - status.truncated
      - provenance.stable_uri
    anti_patterns:
      - {pattern: "radius_arcsec = 60/3600 (把角秒当成度再换算)", level: S1}
      - {pattern: "catalog = 'PS1' 或不归一的大小写/别名形式直传且不声明", level: S2}
      - {pattern: "把 0 行结果说成『查询失败』(0 命中是合法结果, status.ok=True)", level: S3}
    verify:
      anchor: "src/scripts/guards.py validate_search_radius(0, 18000] · validate_coordinate(0≤ra<360, -90≤dec≤90) · references/tools.schema.json cone_search.radius_arcsec"
      verify_cmd: "python -c \"from src.scripts.guards import validate_search_radius as v; print(v(60))\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 05 批量匹配
  - id: NL2T-05
    # 2026-10-18 修: 原题面「我这有 1000 个坐标要匹配」**没给坐标** —— 用户手里有
    # 1000 行, 题面却一行都没带, gold 只能靠占位符 <1000 个 {ra,dec}> 兜底。
    # 实测模型回答"能做, 但请把坐标贴上来"被 toolset 判 0: 题面信息不足以唯一确定
    # gold 轨迹。改成把 payload 内联进题面 (24 个坐标, 保留"一次性做完"这个考点,
    # 24 个已足够区分"批量一次" 与 "每个坐标各查一次")。
    utterance: "这批坐标共 24 个，单位为度，帮我跟 ps1 一次性匹配完：
      180.00/30.00、180.10/30.05、180.20/30.10、180.30/30.15、180.40/30.20、
      180.50/30.25、180.60/30.30、180.70/30.35、180.80/30.40、180.90/30.45、
      181.00/30.50、181.10/30.55、181.20/30.60、181.30/30.65、181.40/30.70、
      181.50/30.75、181.60/30.80、181.70/30.85、181.80/30.90、181.90/30.95、
      182.00/31.00、182.10/31.05、182.20/31.10、182.30/31.15。"
    category: direct
    route: answer
    should_call_best: true
    expect_tools:
      - tool: crossmatch_batch
        args: {coords: "<题面已内联的 24 个 {ra, dec} 对象>", catalog: "ps1",
               radius_arcsec: 3.0, nearest_only: true, max_rows: 50000}
        optional: false
        why: "一批坐标一次性服务端 proximity 匹配是唯一批量入口; coords 内联上传, 不需要建 job"
    key_fields:
      - status.ok
      - data.rows
      - data.mode                    # 服务端批量路径标识
      - data.total_count
      - cost.http_requests
    anti_patterns:
      - {pattern: "拆成 24 次 cone_search (每个坐标各查一次, 严重多余调用, 且浪费服务端配额)", level: S3}
      - {pattern: "给 coords 传 dict/字符串等非数组形态, 或漏 ra/dec 必填字段", level: S2}
      - {pattern: "把『上传星表建 job』(需 OAuth 的 /jobs) 与 crossmatch_batch 混为一谈", level: S2}
    verify:
      anchor: "references/tools.schema.json crossmatch_batch.inputSchema (coords: array of {ra,dec,id?}; radius_arcsec 默认 3.0; nearest_only 默认 true) · src/ai_tools.py crossmatch_batch 默认 max_rows=50000"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));t=[x for x in d['tools'] if x['name']=='crossmatch_batch'][0];print(sorted(t['inputSchema']['properties']), t['inputSchema']['properties']['coords']['items']['required'])\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 06 预算判断 (count)
  - id: NL2T-06
    utterance: "先看看这个天区有多少源，再决定拉不拉。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: cone_search
        args: {ra: 180.0, dec: 30.0, radius_arcsec: 60.0, catalog: "ps1"}   # max_rows 属执行参数, 见文件头 10-18 修订 §1
        optional: false
        why: "先建查询会话拿 sqlid (锥搜本步即两阶段协议的第一步)"
      - tool: count
        args: {sqlid: "<上一步返回的 sqlid, 形如 s3898 或 3898>"}
        # 2026-10-18 修（与 NL2T-12 口径统一）: 原为 optional: false，而 12 把同一次
        # "看看有多少" 的 count 记成多余调用 —— 两题互斥，行为一致的模型不可能都满分
        # （sb1/sb2 在 06 满分、12 扣到 0.812；sb3 反过来）。统一为**可选**：
        # cone_search 信封里已有 total_count，再 count 一次是"多一次请求"，不是决策错误。
        # preferred: true 只影响金标准合成轨迹（保留"先 count 再决定"的示范形态），不参与打分。
        optional: true
        preferred: true
        why: "用服务端真实计数判断数据量再决定是否续拉; 非必需 —— total_count 已在锥搜信封里"
    key_fields:
      - status.ok
      - data.total_count             # count 的服务端真实总数
      - data.returned_count          # 锥搜实际取回行数
      - status.truncated
      - cost.http_requests
    anti_patterns:
      - {pattern: "跳过 count 直接盲拉全量 (预算判断缺失)", level: S3}
      - {pattern: "把 count 的 total 当成 returned_count 报告 (截断当全部)", level: S1}
      - {pattern: "给 count 传页码/坐标等非 sqlid 参数", level: S2}
    verify:
      anchor: "references/tools.schema.json count.inputSchema (sqlid pattern ^s?\\d+$) · references/best-database-guide.md getcount 接口段 (getcount 只认 sqlid 数字部分)"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));print([x for x in d['tools'] if x['name']=='count'][0]['inputSchema']['properties']['sqlid']['pattern'])\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 07 ZTF 语义歧义 (样例, 原样采用)
  - id: NL2T-07
    utterance: "查询 Gaia DR3 1234567890123456789 在 BEST 中的 ZTF g/r/i 星等。"
    category: multi            # 多步轨迹 + 语义歧义
    route: clarify             # 必须先澄清, 不能直接开查
    should_call_best: false    # 澄清阶段不发请求
    expect_tools: []           # 首轮期望零调用 (澄清后的轨迹见 expect_tools_after_clarify)
    clarify:
      required: true
      missing: [ztf_semantics, catalog_choice]
      # probes: 中文话术里"确实在向用户要信息"的判据 (2026-10-04 补, 见 CHANGELOG)。
      # 缺 probes 之前 clarify 维只认六个词 (需要/请提供/请指明/缺少/澄清/哪个),
      # 实测 21 次澄清尝试里 17 次正确地停了手、也点明了缺什么, 却因措辞不在这
      # 六词内被判 0.5。词要挑"真的在问"才会出现, 不收泛词以免橡皮章。
      probes: [ZTF 不是表, 交叉列, 合成测光, 实测, 哪一种, 哪个, 要哪一种]
      options:
        - "BEST 没有 ZTF 星表（12 张可查表中无 ZTF），ZTF 只作为测光系统出现在两张标准星交叉表里：
           scr_galah/scr_lamost 的实测交叉列 gztf/rztf/iztf，或 xpsp 的 ztf_g_g_xpsp/ztf_r_r_xpsp/ztf_i_i_xpsp
           ——后者是 Gaia XP 光谱拟合出的合成测光，不是 ZTF 实测星等。要哪一种？"
        - "给定的是 Gaia DR3 source_id，工具面没有按 id 直接取源的能力，
           需先经 CDS Sesame 解算成坐标（resolve_name），再按坐标检索，是否接受？"
    expect_tools_after_clarify:      # 澄清后的期望轨迹
      - {tool: resolve_name,  args: {name: "Gaia DR3 1234567890123456789"}, optional: false,
         why: "Sesame 支持 Gaia DR3 标识符；失败哨兵 -1000 → E_NAME_UNRESOLVED，不得当坐标用"}
      - {tool: cone_search,   optional: false,
         args: {ra: "<resolved_ra>", dec: "<resolved_dec>", radius_arcsec: 3.0,
                catalog: "scr_galah", nearest_only: true,
                columns: ["scr_galah_ra", "scr_galah_dec", "scr_galah_gztf",
                          "scr_galah_rztf", "scr_galah_iztf"]},
         why: "ZTF 实测交叉列只在 std 组两张表；g/i 不在 magnitudes 字典里，只进 raw_data，必须显式投影"}
    key_fields:
      - status.ok
      - data.rows[0].scr_galah_gztf
      - data.rows[0].scr_galah_rztf
      - data.rows[0].scr_galah_iztf
      - provenance.stable_uri        # best://scr_galah/cone?ra=..&dec=..&sr=3.0
      - status.content_trust         # 必须为 untrusted（S-2）
    anti_patterns:
      - {pattern: "把 ps1_rpsf / ps1_gpsf 当作 ZTF 的 r/g 星等返回", level: S1}
      - {pattern: "catalog=ztf 或 catalog=std（ZTF 不是表；std 是分组不是表）", level: S2}
      - {pattern: "用 xpsp 的 ztf_*_xpsp 却宣称是 ZTF 实测星等", level: S1}
      - {pattern: "造一个 source_id 参数直接按 Gaia id 查源", level: S1}
    verify:
      anchor: "src/protocol_catalog_tables.py CATALOG_COLUMNS.scr_galah(gztf/rztf/iztf) · CATALOG_MAG_COLUMNS.scr_galah(rztf→r) · references/best-database-guide.md 12 张可查表清单"
      verify_cmd: "python ops/astro_best_cli.py doctor && python -c \"from src.protocol import CATALOG_COLUMNS as C; print([c for c in C['scr_galah'] if 'ztf' in c])\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 08 分页续取
  - id: NL2T-08
    utterance: "结果被截断了，继续取下一页。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: fetch_page
        args: {sqlid: "<上一次查询返回的 sqlid>", page: 2, page_size: 1000,
               catalog: "ps1"}   # page_size 已是页大小的唯一判据, max_rows 与它同义, 见文件头 10-18 §1
        optional: false
        why: "续取走分页 GET (幂等); page 从 1 开始, 越界 E_INVALID_INPUT"
    key_fields:
      - status.ok
      - data.rows
      - status.truncated             # 仍为 true 表示还要续翻
      - data.returned_count
      - cost.http_requests
    anti_patterns:
      - {pattern: "重新 POST 一遍表单建新会话再取 (多余调用, 且泄漏服务端查询配额)", level: S2}
      - {pattern: "page 从 0 开始传 (页码 1 起, page<1 被边界校验拒)", level: S2}
      - {pattern: "truncated=false 还继续翻页 (把取完当没取完)", level: S3}
      - {pattern: "续页时丢 catalog 前缀映射导致列错位", level: S1}
    verify:
      anchor: "references/tools.schema.json fetch_page.inputSchema (sqlid pattern ^s?\\d+$; page minimum 1; page_size 1..10000) · src/ai_tools.py fetch_page"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));p=[x for x in d['tools'] if x['name']=='fetch_page'][0]['inputSchema']['properties'];print(p['page']['minimum'], p['page_size']['maximum'])\""
      verified_at: "2026-09-28"

  # -------------------------------------------------- 09 名字→标准星记录
  - id: NL2T-09
    # 2026-10-18 修: 原题面「按名字查**这颗星**」+ 上文「M31（仙女座星系）」——
    # 指代落在一个星系上, 而 gold 要求它等价于一条"标准星记录"。实测模型指出
    # "M31 不是恒星、标准星表里不会有星系记录"后停手追问, 被判 toolset 0.67。
    # 修法是把指代直接写进题面 (一个真正的恒星名), 同时删掉那份上文 ——
    # 本题要考的是「name → 坐标 → 落 std 组成员表」, 不是「星系能不能当恒星查」。
    # 2026-10-18 二次修: 半径与"具体哪张成员表"都不再写死 (见 expect_tools 里的说明)。
    utterance: "按名字查 Betelgeuse 在 BEST 的标准星记录。"
    category: multi
    route: answer
    should_call_best: true
    expect_tools:
      - tool: resolve_name
        args: {name: "<用户给定的天体名>"}
        optional: false
        why: "名字→坐标唯一入口; 失败哨兵 -1000 不得当坐标用"
      - tool: cone_search
        # 2026-10-18 修（标注比题面严，同 06/10/12 一类）：题面只说"标准星记录"，
        # 既没给半径也没点名查 std 组哪张成员表，原 gold 却写死 radius 3.0 +
        # scr_galah + nearest_only。实测三箱一致按 60″ 逐张查三表，参数只中 1/4、
        # convert 判 0 —— 扣的不是能力，是"猜中出题人心里的那个值"。
        # 现口径：半径不入判据（题面未给）；nearest_only 删除（那是
        # crossmatch_batch 的缺省值，不是 cone_search 的语义要求）；catalog 取
        # 三张成员表**任一** —— 考点是"std 是组不是表"，不是"猜中是哪一张"。
        args: {ra: "<resolved_ra>", dec: "<resolved_dec>",
               catalog: ["scr_galah", "scr_lamost", "xpsp"]}
        optional: false
        why: "标准星记录落 std 组三张成员表 (scr_galah/scr_lamost/xpsp), 任一张皆可; 传 'std' 会拿软错误"
