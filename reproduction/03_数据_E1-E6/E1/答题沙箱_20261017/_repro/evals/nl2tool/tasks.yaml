        args: {ra: 180.0, dec: 30.0, radius_arcsec: 60.0, catalog: "ps1",
               sort: "ps1_rpsf", order: "asc", nearest_only: false}
        optional: false
        why: "星等越小越亮, order=asc + sort=ps1_rpsf 即最亮在前。nearest_only 必须为
              false: 它为 true 时只回「离锥心最近的一个匹配」, 排序对该结果无意义 ——
              原标注写 nearest_only: true 与 sort/order 自相矛盾 (2026-10-18 修)。"
    key_fields:
      - status.ok
      - data.rows[0].ps1_rpsf
      - data.rows[0].source_id
      - data.total_count
    anti_patterns:
      - {pattern: "过度澄清反问『最亮按哪个波段/什么口径』而用户已给出 r (OverClarify)", level: S3}
      - {pattern: "sort=ps1_gpsf 却宣称按 r 波段排 (波段错, 静默错值)", level: S1}
      - {pattern: "order=desc 把最暗的当成最亮的返回", level: S1}
      - {pattern: "把 -999 哨兵当『极亮』返回 (哨兵不是星等)", level: S1}
    verify:
      anchor: "references/tools.schema.json cone_search.inputSchema (sort/order 参数) · src/protocol_catalog_tables.py CATALOG_MAG_COLUMNS.ps1 (rpsf→r)"
      verify_cmd: "python -c \"import json;d=json.load(open('references/tools.schema.json',encoding='utf-8'));p=[t for t in d['tools'] if t['name']=='cone_search'][0]['inputSchema']['properties'];print(p['sort']['type'], p['order'])\""
      verified_at: "2026-09-28"

