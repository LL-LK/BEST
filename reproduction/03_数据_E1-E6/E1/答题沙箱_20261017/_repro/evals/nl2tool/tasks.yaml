      - data.rows
      - data.total_count
      - provenance.stable_uri
    anti_patterns:
      - {pattern: "直接把名字当坐标传给 cone_search", level: S1}
      - {pattern: "resolve_name 返回 -1000 哨兵还继续拿去锥搜", level: S1}
      - {pattern: "catalog = 'std' (分组不是表, /std/q 返回软 404)", level: S2}
      - {pattern: "声称查到了标准星记录却没说查的是哪张成员表 (口径不可复现)", level: S3}
    verify:
      anchor: "src/protocol.py NAME_RESOLVE_FAIL_SENTINEL · src/protocol_catalog_tables.py CATALOG_PATHS (std 不是可查询路径; scr_galah/scr_lamost/xpsp 是 std 组成员) · references/best-database-guide.md『std 不是表』"
      verify_cmd: "python -c \"from src.protocol import CATALOG_PATHS as P; print('std' in P, sorted(k for k in P if k.startswith('scr')))\""
      verified_at: "2026-09-28"

