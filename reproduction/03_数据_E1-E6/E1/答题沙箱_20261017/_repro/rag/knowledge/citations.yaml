# 引用规范 (智能体引文时遵守):
#   1. 对外引文只能取 status=verified 的条目; unverified 条目引用时必须显式标注
#      "to be submitted / 无 DOI"。
#   2. DOI 与 Crossref 不一致时以 Crossref 为准并回写本文件。
#   3. 新文献进本文件前必须走 §复现: Crossref REST 逐字段比对。
rules:
  - id: R-citation-discipline
    rule: "verified 才可静默引用; unverified 必须带标注; 严禁编造 DOI"
    anchor: "temp/crossref_verify.json"
