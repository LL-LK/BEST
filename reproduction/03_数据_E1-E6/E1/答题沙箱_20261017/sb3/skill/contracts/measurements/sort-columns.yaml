# contracts/measurements/sort-columns.yaml —— 排序列的**实测**登记表
#
# 职责: 记录「某一列在某张表的某次真实回包里到底有没有值」这一**实测事实**,
#   使 `src/protocol.py` 的 PAGINATION_SORT_COLUMNS 有据可依, 而不是靠注释里的
#   一次观测。断言从这份登记表取 (test/unit/client/test_client_pagination_sort.py),
#   不再把结论硬编码在测试里。
#
# 为什么需要它: 2026-10-07 查出 `known_empty = {"ps1_source_id","uss_dr1_ra_u"}`
#   这条断言**两条都被证伪** ——
#     · `ps1_source_id` 的空值率**位置相关**: (180,30) 样本 0/1000 非空,
#       而 (286.1,15.7) 实测 128 行非空 ⇒ 它不是"恒空列", 只是那个天区恰好空。
#     · `uss_dr1_ra_u` 在 96 列回包里**根本不存在同名列** (回包是裸名 `ra_u`)
#       ⇒ 它不是"空列", 是**登记名写错**。把"不存在"混进"恒空"是两种病。
#
# 口径 (判据写死在这里, 避免各处自己解释):
#   · `present_in_payload`: 该列名是否出现在**回包表头**里。false = 登记名错,
#     注入它服务端不会认。
#   · 一行观测 = 一个 (catalog, region) 上的一次真实回包。`non_empty_rows` 是
#     该列在**样本行**里非空的行数 (空串与字面 nan 都算空 —— 服务端两种都用)。
#   · **没有观测 = 未知**, 不等于空。判据只看"已观测到的", 不把"没测到"当空列。
#
# 证据等级沿用 references §11 的四档: LIVE=真实请求+字节级产物 / SNAPSHOT=入库快照
#   可当场复算 / TEMP=仅 temp 下观测, 换机拿不到 / UNTESTED=未取证。
#
# 维护: 实测后由 `python ops/gen_measurement_registry.py` 重算并覆写本文件
#   (`--check` 只校验不写)。**手改本文件前先跑 `--check`** —— 它会报出与实测不符的条目。
#
# 禁版本号 (铁律 1): 本文件刻意不含 version / schema_version 键。
#   它的"版本"是 git 提交本身。

